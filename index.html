<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#314d40">
  <meta name="description" content="Опора — спокойное пространство для целей, планов и одного важного шага сегодня.">
  <title>Опора — пространство для важного</title>
  <script>try{const t=localStorage.getItem('opora.theme');document.documentElement.dataset.theme=t==='dark'?'dark':'light'}catch{document.documentElement.dataset.theme='light'}document.querySelector('meta[name="theme-color"]').content=document.documentElement.dataset.theme==='dark'?'#101c1d':'#314d40'</script>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=15">
  <script type="module" src="./app.js?v=15"></script>
</head>
<body>
  <div id="app"></div>
  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Для работы планировщика нужно включить JavaScript.</noscript>
</body>
</html>
